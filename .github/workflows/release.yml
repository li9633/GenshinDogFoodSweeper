name: 🚀 Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: '发布渠道'
        required: true
        type: choice
        default: 'release'
        options:
          - release
          - beta
          - alpha

permissions:
  contents: write

env:
  PROJECT: GenshinDogFoodSweeper

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 🐍 安装 Python 3.13.7
        run: uv python install 3.13.7

      - name: 📦 安装依赖
        run: uv sync --group dev

      - name: 🔨 构建 & 打包
        shell: bash
        run: |
          CHANNEL="${{ github.event.inputs.channel || 'release' }}"
          uv run python build.py --channel "$CHANNEL" --installer --zip --clear

      - name: 📋 获取产物信息
        id: dist
        shell: bash
        run: |
          DIST_DIR=$(ls -d dist/${PROJECT}-*/ | head -1)
          DIST_NAME=$(basename "$DIST_DIR")
          echo "name=$DIST_NAME" >> $GITHUB_OUTPUT
          echo "产物目录: $DIST_NAME"

      - name: 🚀 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.dist.outputs.name }}
          files: |
            dist/${{ steps.dist.outputs.name }}.zip
            dist/${{ steps.dist.outputs.name }}-setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}