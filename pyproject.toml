[project]
name = "GenshinDogFoodSweeper"
version = "0.1.0"
description = "原神圣遗物自动化管理工具"
requires-python = ">=3.13.7"
readme = "README.md"

dependencies = [
    # Web 框架
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",

    # 数据层
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",

    # 计算机视觉 + OCR
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "paddlepaddle>=3.2.1",
    "paddleocr>=3.2.0",
    "pillow>=10.0",

    # 自动化控制
    "pydirectinput>=1.0",
    "pyautogui>=0.9.54",
    "pynput>=1.7",
    "pywin32>=308 ; sys_platform == 'win32'",

    # GUI
    "pyqt6>=6.7",
    "pystray>=0.19",

    # 工具库
    "requests>=2.32",
    "rapidfuzz>=3.0",
    "loguru>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]