[project]
name = "GenshinDogFoodSweeper"
version = "0.1.0"
description = "原神圣遗物自动化管理工具"
requires-python = ">=3.13.7"
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "paddleocr>=2.7",
    "pydirectinput>=1.0",
    "pynput>=1.7",
    "pyqt6>=6.7",
    "pystray>=0.19",
    "requests>=2.32",
    "rapidfuzz>=3.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv]
dev-dependencies = []